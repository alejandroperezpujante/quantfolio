# SonarQube project identification. The server URL and the analysis token are
# deliberately kept out of this file: pass them in the environment
# (SONAR_HOST_URL and SONAR_TOKEN) so no secret ever lands in the repository.
sonar.projectKey=quantfolio
sonar.projectName=Quantfolio
sonar.projectVersion=0.1.0

# Analysis scope: the library, the reproducible notebook entry point and the
# network-free test suite. The CSV cache under notebooks/data is generated.
sonar.sources=src,notebooks
sonar.tests=tests
sonar.exclusions=notebooks/data/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Branch coverage report emitted by `uv run pytest` (--cov-report=xml).
sonar.python.coverage.reportPaths=coverage.xml

# JUnit execution report emitted by the same `uv run pytest` run
# (--junitxml=junit.xml): test counts, failures and durations in SonarQube.
sonar.python.xunit.reportPath=junit.xml

# ruff-format (the mandated Python formatter, enforced by pre-commit) canonicalises
# notebook cell sources without a trailing newline, which makes the file-end rule
# ipython:S113 impossible to satisfy in a formatted notebook. It is excluded for
# notebooks only, and the exception is documented in the README.
sonar.issue.ignore.multicriteria=nbFileEnd
sonar.issue.ignore.multicriteria.nbFileEnd.ruleKey=ipython:S113
sonar.issue.ignore.multicriteria.nbFileEnd.resourceKey=**/notebooks/*.ipynb

# Fail the scanner run when the strict server-side quality gate does not pass.
sonar.qualitygate.wait=true
