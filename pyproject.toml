[project]
name = "quantfolio"
version = "0.1.0"
description = "Modular Python toolkit for multi-source stock-market data ingestion, price-series analysis and portfolio management with Monte Carlo simulation."
keywords = [
    "python",
    "quantitative-finance",
    "portfolio-management",
    "monte-carlo-simulation",
    "market-data",
    "yfinance",
    "financial-analysis",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Alejandro Pérez Pujante", email = "perezpujantealejandro1@gmail.com" },
    { name = "Antonio Alberto Presa Ortega", email = "antonio.alberto.presa.ortega@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the Ruff formatter (trailing commas)
    "CPY001", # the project does not require a copyright notice
    "D203",   # incompatible with D211: prefer no blank line before a class docstring
    "D213",   # incompatible with D212: prefer the summary on the first line
    "ISC001", # conflicts with the Ruff formatter (implicit string concatenation)
]

[tool.ruff.lint.isort]
known-first-party = ["quantfolio"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["T201"] # notebooks are the user-facing entry point; printing is their output
"tests/**" = ["PLR2004", "S101"]
# S310 audits urlopen URLs; this module only calls the constant HTTPS Kraken endpoint
# with percent-encoded parameters.
"src/quantfolio/sources/kraken.py" = ["S310"]
# S310 audits urlopen URLs; this module only calls the constant HTTPS Alpha Vantage
# endpoint with percent-encoded parameters.
"src/quantfolio/sources/alpha_vantage/client.py" = ["S310"]
# S310 audits urlopen URLs; this module only calls the constant HTTPS ECB endpoint
# with a percent-encoded, EUR-first series key and query parameters.
"src/quantfolio/sources/ecb.py" = ["S310"]
# The provider imports capabilities; this lazy import keeps the graph acyclic.
"src/quantfolio/sources/alpha_vantage/capabilities.py" = ["PLC0415"]
# Portfolio.report keeps its keyword options explicit in the public signature.
"src/quantfolio/portfolio.py" = ["PLR0913"]
# The report renderer uses the same keyword options as Portfolio.report.
"src/quantfolio/reporting.py" = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-config --strict-markers --cov=quantfolio --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --junitxml=junit.xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quantfolio"]

[tool.coverage.report]
show_missing = true
skip_covered = true
