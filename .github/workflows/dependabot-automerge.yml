name: Dependabot auto-merge

# Patch and minor Dependabot updates arm auto-merge as soon as the pull request
# exists; the protected branch then decides when it lands (`Quality gates` and
# `Strict analysis` on the exact revision, branch up to date with `main`).
# Majors are never armed, and a pull request armed as patch/minor that later
# becomes a major is disarmed again, so they stay open for review.
#
# Dependabot-triggered runs receive a read-only GITHUB_TOKEN, so the `permissions`
# blocks below are what makes writing possible at all.
#
# Anything that needs to move a branch has to be pushed by Dependabot itself:
# GitHub starts no workflow runs for a push made with GITHUB_TOKEN, so a branch
# updated through the API would never receive its required checks and would sit
# stuck behind the "up to date" rule for good. The janitor therefore asks
# Dependabot to rebase instead of updating the branch.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# Neither job checks the repository out, so the GitHub CLI needs the repository
# spelled out explicitly; without it every `gh` call fails outside a work tree.
env:
  GH_REPO: ${{ github.repository }}

jobs:
  classify:
    name: Arm auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'alejandroperezpujante/quantfolio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Arm auto-merge for patch and minor updates
        if: >-
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
          steps.metadata.outputs.update-type)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already armed on this pull request."
            exit 0
          fi
          # `gh pr merge --auto` merges on the spot when the pull request is
          # already mergeable; this mutation always arms and never merges.
          gh api graphql -f query='
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                clientMutationId
              }
            }' -f id="$PR_ID"

      - name: Disarm an update that became a major
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL" \
              || echo "::warning::Could not disarm auto-merge on $PR_URL"
          fi

      - name: Record the decision
        if: always()
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ARMED: >-
            ${{ contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
            steps.metadata.outputs.update-type) }}
        run: |
          if [ "$ARMED" = "true" ]; then
            verdict="armed for auto-merge"
          else
            verdict="left open for review"
          fi
          echo "Dependabot update type \`${UPDATE_TYPE:-unknown}\`: $verdict." >> "$GITHUB_STEP_SUMMARY"

  drain:
    name: Keep the queue moving
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Ask Dependabot to rebase the armed branches that fell behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --state open --limit 50 \
            --json number,headRefName,autoMergeRequest,mergeStateStatus \
            --jq '.[]
                  | select(.headRefName | startswith("dependabot/"))
                  | select(.autoMergeRequest != null)
                  | select(.mergeStateStatus == "BEHIND" or .mergeStateStatus == "UNKNOWN")
                  | .number' > candidates.txt
          while read -r number; do
            asked=$(gh pr view "$number" --json comments \
              --jq '[.comments[] | select(.body | startswith("@dependabot rebase"))] | last | .createdAt // ""')
            head_at=$(gh pr view "$number" --json commits --jq '(.commits | last | .committedDate) // ""')
            if [ -n "$asked" ] && [ "$asked" \> "$head_at" ]; then
              echo "- #$number: already asked to rebase at \`$asked\`, still behind." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if gh pr comment "$number" --body "@dependabot rebase" > /dev/null; then
              echo "- #$number: asked Dependabot to rebase, so its new head gets the required checks." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- #$number: could not post the rebase request; the pull request stays as it was." >> "$GITHUB_STEP_SUMMARY"
            fi
          done < candidates.txt
