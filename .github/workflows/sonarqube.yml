# Strict SonarQube analysis of every revision CI validates.
#
# This reusable workflow is invoked by `ci.yml` after the `Quality gates` job
# (never directly on an event, so a PR check cannot hang waiting for reports
# that were never produced). It downloads the coverage and JUnit reports the
# test job published, joins the team tailnet as an ephemeral `tag:ci` node and
# runs the scanner against the analysed revision; `sonar.qualitygate.wait=true`
# makes the job fail when the `Quantfolio Strict` gate is not green.
#
# It then leaves traceable evidence: the quality gate with all its conditions,
# the open issues, the scanner's compute-engine task and the dashboard link are
# written to the step summary and uploaded as the `sonar-report` artifact.
#
# Required repository configuration:
#   secrets:   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET — Tailscale OAuth client (tag:ci)
#              SONAR_TOKEN — SonarQube project analysis token
#   variables: SONAR_HOST_URL — SonarQube tailnet URL (https://sonar.<tailnet>.ts.net)

name: SonarQube

on:
  workflow_call:
    inputs:
      revision:
        description: Commit SHA that is being analysed (recorded on the analysis).
        required: true
        type: string
    secrets:
      TS_OAUTH_CLIENT_ID:
        description: Tailscale OAuth client id with the tag:ci scope.
        required: true
      TS_OAUTH_SECRET:
        description: Secret of the same Tailscale OAuth client.
        required: true
      SONAR_TOKEN:
        description: SonarQube analysis token of the quantfolio project.
        required: true

permissions:
  contents: read

jobs:
  analysis:
    name: Strict analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_FROZEN: "1"
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Check out the analysed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          # Full history so the analyser can blame lines and detect new code.
          fetch-depth: 0

      - name: Download the test report from the quality job
        uses: actions/download-artifact@v8
        with:
          name: test-report
          path: test-report

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check the quality reports are available
        run: |
          test -f test-report/coverage.xml
          test -f test-report/junit.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('test-report/junit.xml'); ET.parse('test-report/coverage.xml')"
          cp test-report/coverage.xml coverage.xml
          cp test-report/junit.xml junit.xml

      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: quantfolio-ci
          ping: sonar.pangolin-huchen.ts.net

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Record the analysed revision and fail the job when the strict
          # quality gate is not green (sonar.qualitygate.wait=true).
          args: -Dsonar.scm.revision=${{ inputs.revision }}

      - name: Report the quality gate
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = os.environ["SONAR_HOST_URL"].rstrip("/")
          AUTH = "Basic " + base64.b64encode(f"{os.environ['SONAR_TOKEN']}:".encode()).decode()
          PROJECT = "quantfolio"
          DASHBOARD = f"{BASE}/dashboard?id={PROJECT}"
          REVISION = os.environ["REVISION"]
          OUT = pathlib.Path("sonar-report")
          OUT.mkdir(exist_ok=True)
          SUMMARY = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          METRICS = (
              "coverage,branch_coverage,duplicated_lines_density,violations,bugs,"
              "vulnerabilities,code_smells,security_hotspots,reliability_rating,"
              "security_rating,sqale_rating,ncloc"
          )

          def get(path, **params):
              """Call the SonarQube Web API with the project analysis token."""
              url = f"{BASE}{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url)
              request.add_header("Authorization", AUTH)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          lines = [
              "## SonarQube analysis",
              "",
              f"Commit `{REVISION[:12]}` — [dashboard]({DASHBOARD})",
          ]
          report = {"dashboard_url": DASHBOARD, "revision": REVISION}

          task = pathlib.Path(".scannerwork/report-task.txt")
          if task.exists():
              report["ce_task"] = dict(
                  line.split("=", 1) for line in task.read_text().splitlines() if "=" in line
              )
              report["ce_task_id"] = report["ce_task"].get("ceTaskId")
          if report.get("ce_task_id"):
              try:
                  task_info = get("/api/ce/task", id=report["ce_task_id"])["task"]
                  report["ce_status"] = task_info.get("status")
                  report["analysis_id"] = task_info.get("analysisId")
              except (urllib.error.URLError, OSError, KeyError, ValueError) as exc:
                  lines += ["", f"> Task details unavailable: {exc}"]
          status_note = f" — status `{report['ce_status']}`" if report.get("ce_status") else ""
          analysis_note = (
              f", analysis `{report['analysis_id']}`" if report.get("analysis_id") else ""
          )
          lines += [
              "",
              f"Compute-engine task `{report.get('ce_task_id', '?')}`"
              f"{status_note}{analysis_note}.",
          ]

          try:
              gate = get("/api/qualitygates/project_status", projectKey=PROJECT)["projectStatus"]
              measures = {
                  measure["metric"]: measure.get("value")
                  for measure in get(
                      "/api/measures/component", component=PROJECT, metricKeys=METRICS
                  )["component"]["measures"]
              }
              payload = get(
                  "/api/issues/search",
                  componentKeys=PROJECT,
                  resolved="false",
                  facets="types,severities",
                  ps=100,
              )
              issues = payload["issues"]
              report.update(
                  gate_status=gate["status"],
                  gate_conditions=[
                      {
                          "metric_key": condition["metricKey"],
                          "comparator": condition.get("comparator"),
                          "threshold": condition.get("errorThreshold"),
                          "actual": condition.get("actualValue"),
                          "status": condition["status"],
                      }
                      for condition in gate["conditions"]
                  ],
                  measures=measures,
                  issues_total=payload["total"],
              )
              lines += [
                  "",
                  f"**Quality gate `Quantfolio Strict`**: "
                  f"{'PASSED' if gate['status'] == 'OK' else 'FAILED'}",
                  "",
                  "| Condition | Actual | Threshold | Status |",
                  "|---|---|---|---|",
              ]
              for condition in gate["conditions"]:
                  state = "OK" if condition["status"] == "OK" else "**FAIL**"
                  lines.append(
                      f"| `{condition['metricKey']}` | {condition.get('actualValue', '-')} "
                      f"| {condition.get('comparator', '')} {condition.get('errorThreshold', '')} "
                      f"| {state} |"
                  )
              lines += [
                  "",
                  f"Open issues: **{payload['total']}** (bugs {measures.get('bugs', '?')}, "
                  f"vulnerabilities {measures.get('vulnerabilities', '?')}, "
                  f"code smells {measures.get('code_smells', '?')})",
                  "",
                  f"Coverage {measures.get('coverage', '?')} % "
                  f"(branch {measures.get('branch_coverage', '?')} %), "
                  f"duplicated lines {measures.get('duplicated_lines_density', '?')} %.",
              ]
              for facet in payload.get("facets", []):
                  counts = {
                      bucket["val"]: bucket["count"]
                      for bucket in facet["values"]
                      if bucket["count"]
                  }
                  if not counts:
                      continue
                  lines += ["", f"### Issues by {facet['property']}", "", "| Item | Count |", "|---|---|"]
                  for item, count in sorted(
                      counts.items(), key=lambda pair: (-pair[1], pair[0])
                  )[:15]:
                      lines.append(f"| `{item}` | {count} |")
              if issues:
                  lines += [
                      "",
                      "### Open issues",
                      "",
                      "| File | Line | Severity | Rule | Message |",
                      "|---|---:|---|---|---|",
                  ]
                  for issue in issues[:20]:
                      message = issue.get("message", "").replace("|", "\\|")[:160]
                      lines.append(
                          f"| `{issue['component'].split(':', 1)[-1]}` | {issue.get('line', '-')} "
                          f"| {issue.get('severity', '-')} | `{issue['rule']}` | {message} |"
                      )
          except (urllib.error.URLError, OSError, KeyError, ValueError) as exc:
              lines += ["", f"> Reporting failed: {exc}"]

          (OUT / "gate-summary.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          SUMMARY.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-report
          path: |
            .scannerwork/report-task.txt
            sonar-report/
          if-no-files-found: warn
